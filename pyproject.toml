[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lsp-stgcn-fewshot"
version = "0.1.0"
description = "Peruvian Sign Language recognition with spatio-temporal graph networks and few-shot signer calibration."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Guillermo Ronie Salcedo Alvarez" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch==2.12.0",
    "numpy==2.4.6",
    "scikit-learn==1.9.0",
    "PyYAML==6.0.3",
    "pandas==3.0.3",
    "matplotlib==3.11.0",
    "seaborn==0.13.2",
]

[project.optional-dependencies]
# Live recording and the Streamlit demo. mediapipe is pinned to 0.10.14 because later releases
# removed the legacy `mp.solutions.holistic` API used by the recorder.
demo = [
    "mediapipe==0.10.14",
    "opencv-python==4.13.0.92",
    "streamlit==1.59.1",
]
weights = ["huggingface_hub>=0.24"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741"]  # single-letter names (A, C, T, V) follow the graph-convolution notation

[tool.ruff.lint.per-file-ignores]
"demo/**" = ["E402"]  # pages add the demo folder to sys.path before importing local modules

[tool.pytest.ini_options]
testpaths = ["tests"]
