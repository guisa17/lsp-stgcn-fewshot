exp_name: hagcn_v2
seed: 42
data:
  bundle: data/processed/canonical_v2.npz
  split: data/splits/intra_subject_v2.json
  streams:
  - landmarks
  - bones
  - motion
model:
  type: hagcn
  channels:
  - 32
  - 64
  - 64
  t_kernel: 9
  dropout: 0.3
  drop_graph: 0.1
train:
  epochs: 150
  batch_size: 32
  lr: 0.001
  weight_decay: 0.0001
  patience: 20
  device: cpu
augment:
  enabled: true
  temporal_scale: true
  rotation: true
  jitter: true
  mirror: false
