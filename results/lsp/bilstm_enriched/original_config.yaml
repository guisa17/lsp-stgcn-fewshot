exp_name: bilstm_enriched_v2
seed: 42
data:
  bundle: data/processed/canonical_v2.npz
  split: data/splits/intra_subject_v2.json
  streams:
  - landmarks
  - bones
  - motion
model:
  type: bilstm
  hidden1: 64
  hidden2: 32
  dense: 64
  dropout: 0.4
train:
  epochs: 150
  batch_size: 32
  lr: 0.0005
  weight_decay: 0.0001
  patience: 20
  device: cpu
augment:
  enabled: true
  temporal_scale: true
  rotation: true
  jitter: true
  mirror: false
